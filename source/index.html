<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#eff7fa" />
    <script>try{const t=localStorage.getItem('little-voyages-theme');document.documentElement.dataset.theme=t==='dark'||t==='light'?t:(matchMedia('(prefers-color-scheme: dark)').matches?'dark':'light')}catch{document.documentElement.dataset.theme='light'}</script>
    <meta name="description" content="A little atlas of a life at sea. Explore 29 cruises, from the Bahamas to Japan, through animated maps, itineraries, a personal voyage timeline, and playful travel statistics." />
    <title>Little voyages — My cruise atlas</title>
    <link rel="icon" type="image/svg+xml" href="./favicon.svg" />
  </head>
  <body>
    <div id="app"></div>
    <script type="module" src="/src/main.js"></script>
  </body>
</html>
